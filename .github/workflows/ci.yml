# CI: build and test on every pull request and every push to main.
# Tests run against an in-memory H2 database (src/test/resources/application.properties),
# so no Supabase credentials or secrets are needed here.
# The auth rule sensors (AuthRulesTest / CanaryRulesTest, docs/harness.md §3.1) run as part of verify.
# The harness hooks themselves (.claude/hooks/tests) are tested right after.
# Every run also uploads the harness events (findings + the CI result; a red push to main is "main-red")
# as the artifact harness-events (docs/harness.md §2).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

      # ハーネスのフック（Stop フック・事象の口）そのもののテスト（docs/harness.md §7.1）。標準ライブラリだけ・数秒
      - name: Test harness hooks
        run: python3 -m unittest discover -s .claude/hooks/tests -v

      - name: Collect harness events (findings + CI result)
        if: always()
        env:
          HARNESS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .claude/hooks/harness_events.py ci --status ${{ job.status }}

      - name: Upload harness events (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-events
          path: target/harness/events/ci.jsonl
          retention-days: 30

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

  # SLO のルール（docs/SLO.md §6）：定義（monitoring/sloth/authserver.yml）と生成物（monitoring/prometheus/slo-rules.yml）の食い違い、
  # ルールの文法、アラートの単体テスト（monitoring/prometheus/tests/）を見る。ツールは版とハッシュを固定して入れる。
  slo-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLOTH_VERSION: v0.11.0
      SLOTH_SHA256: a28a1e3f35830b362eba5ac5b98635e9ab426cf4448b0dc623ba2aa8c5ad5a52
      PROMETHEUS_VERSION: 2.53.2
      PROMETHEUS_SHA256: 60c126740c9cf1206b1e72150dd17914f1c3309bb7dc78a31d4670197ed4fa69
    steps:
      - uses: actions/checkout@v4

      - name: Install sloth and promtool (pinned)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/bin/sloth" "https://github.com/slok/sloth/releases/download/${SLOTH_VERSION}/sloth-linux-amd64"
          echo "${SLOTH_SHA256}  $RUNNER_TEMP/bin/sloth" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/sloth"
          curl -sSfL -o "$RUNNER_TEMP/prom.tgz" "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  $RUNNER_TEMP/prom.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/prom.tgz" -C "$RUNNER_TEMP" --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          mv "$RUNNER_TEMP/promtool" "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check generated rules, syntax and alert tests
        run: monitoring/generate.sh --check
