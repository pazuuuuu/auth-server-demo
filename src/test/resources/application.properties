# テスト用の設定（src/main/resources/application.properties を丸ごと置き換える）。
# 本番の Supabase(PostgreSQL) には繋がず、H2 のインメモリ DB（PostgreSQL 互換モード）で起動する。
# CI（.github/workflows/ci.yml）でも同じ設定で回る。
spring.datasource.url=jdbc:h2:mem:authserver;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# 本番と同じく schema.sql で表を作り、Hibernate は食い違いの検出だけ（validate）＝schema.sql の users 表もここで確かめる
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# 本番と同じ schema.sql（Spring Authorization Server のテーブル）を適用する
spring.sql.init.mode=always

# テスト専用の値（本番は環境変数）
app.oidc-client.secret=test-only-client-secret-0123456789abcdef
app.base-url=http://localhost:8080
