# 既定（本番向け）の設定。開発向けの DEBUG ログ・SQL の表示・デモ利用者・再設定リンクのログ出力は
# application-dev.properties（SPRING_PROFILES_ACTIVE=dev）に分けている（docs/harness.md §3.1 config/prod-defaults）。

# Database Configuration (Supabase)
# Credentials are supplied via environment variables. See .env.example.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 表は schema.sql で作る（users も含む）。Hibernate は表を変えず、エンティティとの食い違いだけを起動時に検出する
spring.jpa.hibernate.ddl-auto=validate

# SQL Initialization
spring.sql.init.mode=always

# OIDC のデモ用クライアント（oidc-client）のシークレット。PasswordEncoder で encode して保存する
app.oidc-client.secret=${OIDC_CLIENT_SECRET}
# パスワード再設定リンクの先頭（利用者に見せる URL）
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ID トークン・アクセストークンの署名鍵（PKCS#8 の RSA 秘密鍵 PEM・2048 bit 以上）。未設定だと起動しない（docs/SLO.md §7）
app.jwt.signing-key=${JWT_SIGNING_KEY:}
# ローテーション中の旧鍵の公開鍵（PEM を0個以上）。JWKS に並べて、旧鍵で署名済みのトークンを検証できるようにする
app.jwt.previous-public-keys=${JWT_PREVIOUS_PUBLIC_KEYS:}

# 計測（docs/SLO.md §6）。管理用のエンドポイントは利用者向けの 8080 とは別のポートだけで公開する（2026-10-17 利用者判断）。
# ★このポートは LB・ファイアウォールで外に出さない（Prometheus からだけ届くようにする）
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
