# 開発用プロファイル（SPRING_PROFILES_ACTIVE=dev）。本番では読み込まれない。
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.webauthn=DEBUG
logging.level.com.example.authserver=DEBUG
spring.jpa.show-sql=true

# デモ利用者 user のパスワード（未設定なら作らない）。パスワード再設定のリンクはログに出る（LoggingPasswordResetNotifier）
app.demo-user.password=${DEMO_USER_PASSWORD:}

# JWT_SIGNING_KEY が無ければ起動ごとの鍵で動かす（再起動すると発行済みのトークンは検証できなくなる）
app.jwt.allow-ephemeral-key=true
